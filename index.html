<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Office 转 PDF · 苏少工具</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#18243b;font:16px system-ui,sans-serif}main{max-width:640px;margin:10vh auto;padding:32px;background:white;border-radius:24px;box-shadow:0 12px 50px #172b4d10}h1{margin:16px 0;font-size:32px}p{color:#647086;line-height:1.8}a{color:#335bd4}label{display:block;margin:28px 0 12px;font-weight:600}input{width:100%;padding:20px;border:2px dashed #cbd5e7;border-radius:12px}button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:12px;background:#335bd4;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#status{min-height:48px;white-space:pre-wrap}small{color:#647086}@media(max-width:680px){main{margin:24px 16px;padding:24px}}
</style>
<main>
<a href="https://sushao-nav.vercel.app/">← 返回工具导航</a>
<h1>Office 转 PDF</h1>
<p>将 Word、Excel、PowerPoint 文件转换为 PDF。<br>支持 DOCX、XLSX、PPTX，单个文件限 4MB。</p>
<form id="form"><label for="file">选择文件</label><input id="file" type="file" accept=".docx,.xlsx,.pptx" required><button id="convert">转换并下载 PDF</button></form>
<p id="status" role="status" aria-live="polite"></p>
<small>首次启动可能稍慢。复杂排版与特殊字体请检查转换结果。</small>
</main>
<script>
const form=document.querySelector('#form'),file=document.querySelector('#file'),button=document.querySelector('#convert'),status=document.querySelector('#status');
form.addEventListener('submit',async event=>{
 event.preventDefault(); const input=file.files[0];
 if(!input || !/\.(docx|xlsx|pptx)$/i.test(input.name)){status.textContent='请选择 DOCX、XLSX 或 PPTX 文件。';return;}
 if(input.size>4*1024*1024-4096){status.textContent='文件超过 4MB，请选择较小的文件。';return;}
 button.disabled=true;status.textContent='正在转换，请稍候…';
 try{
  const data=new FormData();data.append('files',input);
  const response=await fetch('/api/convert',{method:'POST',body:data});
  if(!response.ok){throw new Error(response.status===413?'文件或转换结果过大。':await response.text());}
  if(!response.headers.get('Content-Type')?.includes('application/pdf'))throw new Error('服务未返回 PDF，请稍后重试。');
  const url=URL.createObjectURL(await response.blob()),link=document.createElement('a');
  link.href=url;link.download=input.name.replace(/\.[^.]+$/,'.pdf');document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  status.textContent='转换完成，PDF 已开始下载。';
 }catch(error){status.textContent=error.message || '转换失败，请稍后重试。';}
 finally{button.disabled=false;}
});
</script>
</html>
